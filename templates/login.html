{% extends "base.html" %}
{% block title %}로그인 — Payroll Guard{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="pg-card">
      <div class="text-center mb-3">
        <img src="{{ url_for('static', filename='img/etners-logo.png') }}" alt="Etners" height="28">
        <div class="text-muted small mt-1">Payroll Guard</div>
      </div>
      <form method="post">
        <div class="mb-3">
          <label class="form-label small">아이디</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small">비밀번호</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
      </form>
      <hr>
      <p class="text-muted small mb-0">
        샘플 계정<br>
        관리자: admin / admin1234 (기준 관리 접근 가능)<br>
        담당자: staff1 / staff1234
      </p>
    </div>
  </div>
</div>
{% endblock %}
